name: Import Sidebar v2.2.0 and build Pixel Sidebar

on:
  push:
    branches:
      - design/material-you-pixel
    paths:
      - IMPORT_REQUEST.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-sidebar-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pixel Sidebar repository
        uses: actions/checkout@v4
        with:
          ref: design/material-you-pixel
          fetch-depth: 0

      - name: Checkout upstream Sidebar v2.2.0
        uses: actions/checkout@v4
        with:
          repository: alkisstam/sidebar
          ref: v2.2.0
          path: upstream-source
          fetch-depth: 1

      - name: Import upstream source while preserving project automation
        shell: bash
        run: |
          # Transfer the upstream working tree, but never copy its .git
          # metadata over this repository's own Git metadata.
          tar -C upstream-source --exclude='./.git' -cf - . | tar -C . -xf -
          rm -rf upstream-source

          # Upstream marks the debug variant as Metro-dependent by default.
          # Pixel Sidebar distributes a standalone APK, so embed the JS bundle.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = '    // debuggableVariants = ["liteDebug", "prodDebug"]'
          if marker not in s:
              raise SystemExit("Expected React Native debuggableVariants marker not found")
          s = s.replace(marker, '    debuggableVariants = []', 1)
          p.write_text(s)
          PY

          grep -n 'debuggableVariants = \[\]' android/app/build.gradle

          # Restore the destination repository explicitly before committing.
          git remote set-url origin "https://github.com/Gautier7799/Samart-sidebar-pixel.git"
          test "$(git remote get-url origin)" = "https://github.com/Gautier7799/Samart-sidebar-pixel.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream Sidebar v2.2.0 baseline"
            git push origin HEAD:design/material-you-pixel
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify standalone JavaScript bundle in APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if ! unzip -l "$APK" | grep -E 'assets/index\.android\.bundle      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-sidebar-v2.2.0-baseline-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
; then
            echo "ERROR: assets/index.android.bundle is missing from the APK"
            exit 1
          fi
          echo "Verified: assets/index.android.bundle is packaged in $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-sidebar-v2.2.0-baseline-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
