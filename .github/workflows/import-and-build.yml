name: Build Pixel Sidebar APK

on:
  push:
    branches:
      - design/material-you-pixel
      - feature/material-you-floating-sidebar
      - feature/sidebar-oem-additions-material-you
      - main
    paths:
      - "app/**"
      - "src/**"
      - "modules/**"
      - "android/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-sidebar-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current design branch (no upstream overwrite)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Build standalone Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify standalone JavaScript bundle in APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F "assets/index.android.bundle"
          echo "Verified: JavaScript bundle is embedded in the APK."

      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-sidebar-material-you-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
